[package]
name = "prismflow"
version = "1.0.0"
description = "One app in, any model out: connect your AI coding apps to any model provider"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "prismflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
toml_edit = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "net", "sync", "io-util"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
# Gateway broker
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
sha2 = "0.10"
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Discord bot gateway (src/bots/discord.rs)
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

tauri-plugin-updater = { version = "2", optional = true }
# Companion API: TLS 1.3 listener with a
# per-install self-signed certificate; QR codes for pairing.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service", "http1"] }
rcgen = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[features]
# Release builds: `--features updater` plus the owner's signing pubkey
# (scripts/release.sh). Dev builds have no updater and say so in the UI.
updater = ["dep:tauri-plugin-updater"]

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

# Real-binary smoke; its own executable doubles as the Keychain helper
# (see the file header). Runs only with PRISMFLOW_REAL_SMOKE=1.
[[test]]
name = "real_agents"
harness = false

# Sandboxed real-app run and gateway stress; runs only with PRISMFLOW_E2E=1.
[[test]]
name = "sandbox_e2e"
harness = false

# Performance budgets; runs only with PRISMFLOW_PERF=1.
[[test]]
name = "perf"
harness = false

[package]
name = "prismflow"
version = "0.1.0"
description = "PrismFlow — connect AI providers to your AI applications"
edition = "2021"

[lib]
name = "prismflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
toml_edit = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "net", "sync", "io-util"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
# Slice 2 broker (docs/superpowers/plans/2026-10-14-prismflow-gateway-slice2.md)
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
sha2 = "0.10"
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

# Real-binary smoke; its own executable doubles as the Keychain helper
# (see the file header). Runs only with PRISMFLOW_REAL_SMOKE=1.
[[test]]
name = "real_agents"
harness = false

# Unsigned test installers you can download from the Actions run page
# (Windows .msi/.exe, macOS .dmg, Linux .deb/.AppImage). Started by hand:
# Actions → test-build → Run workflow. Not for distribution: unsigned, so
# Windows SmartScreen and macOS Gatekeeper will warn.
name: test-build
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            node_platform: win-x64
          - os: macos-14
            node_platform: darwin-arm64
          - os: ubuntu-24.04
            node_platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - run: npm ci
      - name: Bundle the gateway engine and Node runtime
        shell: bash
        run: |
          scripts/fetch-gateway.sh
          scripts/fetch-node.sh ${{ matrix.node_platform }}
      - name: Build (unsigned, with the bundled engine and Node)
        shell: bash
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: prismflow-test-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

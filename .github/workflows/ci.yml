# Build and test PrismFlow on every supported desktop platform.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries (Tauri, Secret Service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - name: Frontend
        run: |
          npm ci
          npm run build
      - name: Pinned gateway engine
        shell: bash
        run: scripts/fetch-gateway.sh
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Updater feature compiles
        working-directory: src-tauri
        run: cargo check --locked --features updater
      - name: Real terminal agents start through the Windows launcher
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: bash
        run: |
          npm install -g @qwen-code/qwen-code@0.25.2 opencode-ai@1.19.0 @continuedev/cli@1.5.47
          PRISMFLOW_WIN_AGENTS="qwen opencode continue_cli" cargo test --locked --test windows_agents -- --ignored --nocapture
